<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindBloom</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <nav id="navbar-example2" class="navbar bg-body-tertiary px-3 mb-3">
      <a class="navbar-brand" href="#">MindBloom</a>
      <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link" href="#scrollspyHeading1">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#scrollspyHeading2">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#scrollspyHeading2">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#scrollspyHeading2">Contact Us</a>
        </li>
      </ul>
    </nav>
    <div
      data-bs-spy="scroll"
      data-bs-target="#navbar-example2"
      data-bs-root-margin="0px 0px -40%"
      data-bs-smooth-scroll="true"
      class="scrollspy-example bg-body-tertiary p-3 rounded-2"
      tabindex="0"
    >
      <h4 id="scrollspyHeading1">MindBloom</h4>
      <p>...</p>
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="assest/p1.jpg" class="d-block w-100" alt="Image1" />
          </div>
          <div class="carousel-item">
            <img src="assest/p2.jpg" class="d-block w-100" alt="image2" />
          </div>
          <div class="carousel-item">
            <img src="assest/p6.jpg" class="d-block w-100" alt="iamge3" />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <button
        type="button"
        class="btn btn-outline-primary"
        class="align-content-center p-4 position-fixed"
      >
        Start Your Journey
      </button>

      <h4 id="scrollspyHeading2">About Us</h4>
      <p>...</p>

      <h4 id="scrollspyHeading3">Services</h4>
      <p>...</p>

      <div class="card" style="width: 18rem">
        <img src="assest/p7.jpg" class="card-img-top" alt="..." />
        <div class="card-body">
          <h5 class="card-title">Individual Counselling</h5>
          <p class="card-text">
            Some quick example text to build on the card title and make up the
            bulk of the card’s content.
          </p>
          <a href="#" class="btn btn-primary">View More</a>
        </div>
      </div>

      <h4 id="scrollspyHeading5">Contact us</h4>
      <p>...</p>
    </div>
  </body>
</html>
